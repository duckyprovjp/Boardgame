services:
  - type: web
    name: boardgame-server
    runtime: node
    rootDir: apps/server
    plan: free
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm build:server && pnpm --filter @boardgame/server db:migrate:deploy
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
